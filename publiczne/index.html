<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kancelaria Notarialna Łukasz Kozon — Rejestr akcjonariuszy P.S.A.</title>

  <!-- Trzy role, trzy kroje (SESJA-PSA-6-INTERFEJS.md, sekcja 2.2):
       EB Garamond — display, Inter Tight — interfejs, IBM Plex Mono — dane. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap&subset=latin-ext">

  <!-- Kolejność ma znaczenie: warstwa przejściowa i style zastane ładują się
       PRZED `rejestr.css`, żeby przy kolizji nazw wygrywał nowy system. -->
  <link rel="stylesheet" href="/style/zgodnosc.css">
  <link rel="stylesheet" href="/style/psa.css">
  <link rel="stylesheet" href="/style/rejestr.css">

  <!-- Wersje przypięte (sekcja 13 specyfikacji) — bez bundlera.
       Serwowane LOKALNIE z /vendor zamiast z unpkg: rejestr akcjonariuszy
       musi wstawać także wtedy, gdy kancelaria nie ma internetu albo CDN
       jest niedostępny. Te same wersje, te same pliki, tylko bez sieci. -->
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/vendor/babel.min.js"></script>
</head>
<body>
  <div id="korzen"></div>

  <script type="text/babel" data-presets="react" src="/js/rdzen.js"></script>
  <script type="text/babel" data-presets="react" src="/js/ui.js"></script>
  <!-- ui-rejestr.js ładuje się PO ui.js: nadpisuje prymitywy nową wersją. -->
  <script type="text/babel" data-presets="react" src="/js/ui-rejestr.js"></script>
  <script type="text/babel" data-presets="react" src="/js/podglad.js"></script>
  <script type="text/babel" data-presets="react" src="/js/pulpit.js"></script>
  <script type="text/babel" data-presets="react" src="/js/pesel.js"></script>
  <script type="text/babel" data-presets="react" src="/js/osoby.js"></script>
  <script type="text/babel" data-presets="react" src="/js/zgloszenia.js"></script>
  <script type="text/babel" data-presets="react" src="/js/wnioski.js"></script>
  <script type="text/babel" data-presets="react" src="/js/spolki.js"></script>
  <script type="text/babel" data-presets="react" src="/js/dokumenty-na-zadanie.js"></script>
  <script type="text/babel" data-presets="react" src="/js/kokpit.js"></script>
  <script type="text/babel" data-presets="react" src="/js/kreator.js"></script>
  <script type="text/babel" data-presets="react" src="/js/sprawy.js"></script>
  <script type="text/babel" data-presets="react" src="/js/wydruk.js"></script>
  <script type="text/babel" data-presets="react" src="/js/konfiguracja.js"></script>
  <script type="text/babel" data-presets="react" src="/js/szablony.js"></script>
  <script type="text/babel" data-presets="react" src="/js/auth.js"></script>
  <script type="text/babel" data-presets="react" src="/js/uzytkownicy.js"></script>
  <script type="text/babel" data-presets="react" src="/js/oplaty.js"></script>
  <script type="text/babel" data-presets="react" src="/js/migracja.js"></script>
  <script type="text/babel" data-presets="react" src="/js/app.js"></script>
</body>
</html>

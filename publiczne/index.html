<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kancelaria Notarialna Łukasz Kozon — Rejestr akcjonariuszy P.S.A.</title>

  <!-- Trzy role, trzy kroje (SESJA-PSA-6-INTERFEJS.md, sekcja 2.2):
       EB Garamond — display, Inter Tight — interfejs, IBM Plex Mono — dane. -->

  <!-- Kolejność ma znaczenie: warstwa przejściowa i style zastane ładują się
       PRZED `rejestr.css`, żeby przy kolizji nazw wygrywał nowy system. -->
  <link rel="stylesheet" href="/style/zgodnosc.css">
  <link rel="stylesheet" href="/style/psa.css">
  <link rel="stylesheet" href="/style/rejestr.css">

  <!-- Główny krój interfejsu wczytuje się od razu, pozostałe — gdy są potrzebne. -->
  <link rel="preload" href="/fonty/inter-tight-latin.woff2" as="font" type="font/woff2" crossorigin>

  <!-- React serwowany LOKALNIE z /vendor (rejestr ma wstawać także bez
       internetu). JSX jest skompilowany przy budowaniu (`npm run buduj`,
       D-046) — przeglądarka nie ładuje już Babela. -->
  <script src="/vendor/react.production.min.js" defer></script>
  <script src="/vendor/react-dom.production.min.js" defer></script>
  <script src="/dist/kancelaria.js" defer></script>
  <meta name="robots" content="noindex, nofollow">
</head>
<body>
  <noscript>Ta aplikacja wymaga włączonej obsługi JavaScriptu.</noscript>
  <div id="korzen"></div>
</body>
</html>
